worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

stream {
    log_format passthrough '$time_iso8601 client=$remote_addr '
                           'sni=$ssl_preread_server_name '
                           'upstream=$upstream_addr '
                           'sent=$bytes_sent received=$bytes_received '
                           'duration=$session_time';
    access_log /dev/stdout passthrough;

    upstream real_xchanger_tls {
        # Use the WAF IP directly so the locally overridden DNS record cannot
        # send the upstream leg back into this listener.
        server 47.110.175.169:443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 5m;
        proxy_pass real_xchanger_tls;
    }
}
