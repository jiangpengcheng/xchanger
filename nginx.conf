events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 80;
        server_name api.xchanger.cn;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://host.docker.internal:8080;
        }
    }
}
